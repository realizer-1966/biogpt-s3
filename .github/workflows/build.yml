name: ESP32-S3 Build Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          platformio --version
      
      - name: Install ESP32 Platform
        run: |
          pio pkg install --platform espressif32@6.12.0
          pio pkg list
      
      - name: Build Project
        run: |
          cd biogpt-s3
          echo "=== Starting PlatformIO Build ==="
          pio run -e esp32-s3-devkitc-1 2>&1 | tee build.log
          echo "=== Build Exit Code: $? ==="
      
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biogpt-s3-firmware
          path: biogpt-s3/.pio/build/esp32-s3-devkitc-1/
          retention-days: 7
      
      - name: Show Build Logs on Failure
        if: failure()
        run: |
          echo "=== Build Failed ==="
          echo "Checking .pio/build directory..."
          ls -la biogpt-s3/.pio/build/ 2>&1 || echo "No build directory"
          echo ""
          echo "=== Build Log ==="
          cat biogpt-s3/build.log 2>/dev/null || echo "No build.log found"
          echo ""
          echo "=== PlatformIO Cache ==="
          find biogpt-s3/.pio -type f -name "*.log" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
