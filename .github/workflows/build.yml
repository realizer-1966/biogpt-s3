name: ESP32-S3 Build Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      
      - name: Install ESP32 Platform
        run: |
          pio pkg install --platform espressif32@6.12.0
      
      - name: Build Project
        run: |
          cd biogpt-s3
          pio run -e esp32-s3-devkitc-1
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biogpt-s3-firmware
          path: biogpt-s3/.pio/build/esp32-s3-devkitc-1/
          retention-days: 7
      
      - name: Check Build Success
        run: |
          if [ -f "biogpt-s3/.pio/build/esp32-s3-devkitc-1/firmware.bin" ]; then
            echo "✅ Build successful!"
            ls -lh biogpt-s3/.pio/build/esp32-s3-devkitc-1/firmware.bin
          else
            echo "❌ Build failed - firmware.bin not found"
            exit 1
          fi
