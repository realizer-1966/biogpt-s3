name: ESP32-S3 Build Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      
      - name: Install ESP32 Platform
        run: |
          pio pkg install --platform espressif32@6.12.0
      
      - name: Build Project
        run: |
          cd biogpt-s3
          pio run -e esp32-s3-devkitc-1 --verbose
      
      - name: Show Build Logs on Failure
        if: failure()
        run: |
          echo "=== Build Failed ==="
          echo "Checking .pio/build directory..."
          ls -la biogpt-s3/.pio/build/ || echo "No build directory"
          find biogpt-s3/.pio -name "*.log" -exec cat {} \; 2>/dev/null || true
