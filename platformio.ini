; BioGPT-S3 — 헬스케어 이상 탐지를 위한 PLE-HandGPT 하이브리드
; ESP32-S3 N16R8 (16MB Flash / 8MB PSRAM) 타겟
; License: Apache 2.0

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; upload_port = COM19  ; 실제 포트로 변경

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; PLE-HandGPT 하이브리드 설정
    -DNV=20           ; 심볼릭 어휘 (20 심볼)
    -DNC=96           ; d_model (esp32-ai 에서 축소)
    -DNT=32           ; 컨텍스트 윈도우
    -DNPLE=64         ; PLE dim
    -DNLAYER=4        ; 레이어 수 (메모리 제약)
    -DUSE_PLE=1       ; PLE 활성화
    -DUSE_HOLDOUT=1   ; Hold-out 검증 활성화

lib_deps =
    olikraus/U8g2@^2.35.19
    ; adafruit/Adafruit MAX3010x Library  ; 심박 센서 (선택)

; 시리얼 모니터 필터 (선택)
; monitor_filters = esp32_exception_decoder
